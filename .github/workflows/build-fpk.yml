name: Build Hermes Studio FPK

on:
  workflow_dispatch:
    inputs:
      use_latest_releases:
        description: 'Build the newest formal upstream Releases'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 13 * * *'
  push:
    branches: [main]
    paths:
      - 'fpk/**'
      - 'scripts/**'
      - 'versions.lock'
      - '.github/workflows/build-fpk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zstd patchelf imagemagick
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Build runtime and FPK
        env:
          PYTHON_STANDALONE_ARCHIVE_URL: ${{ vars.PYTHON_STANDALONE_ARCHIVE_URL }}
          CHROMIUM_ARCHIVE_URL: ${{ vars.CHROMIUM_ARCHIVE_URL }}
          UV_BIN: uv
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "${{ inputs.use_latest_releases }}" = true ]; then
            USE_LATEST_RELEASES=1 ./scripts/build-fpk.sh
          else
            ./scripts/build-fpk.sh
          fi
      - name: Upload FPK
        uses: actions/upload-artifact@v4
        with:
          name: HermesStudio-fnOS-x86_64
          path: dist/*
