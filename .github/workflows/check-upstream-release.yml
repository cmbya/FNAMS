name: Check formal Hermes upstream Releases

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and trigger when upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          source versions.lock
          latest_agent=$(gh api repos/NousResearch/hermes-agent/releases --paginate --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' | head -n1)
          latest_studio=$(gh api repos/EKKOLearnAI/hermes-studio/releases --paginate --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' | head -n1)
          if [ "$latest_agent" != "$HERMES_AGENT_TAG" ] || [ "$latest_studio" != "$HERMES_STUDIO_TAG" ]; then
            echo "New formal Release: Agent=$latest_agent Studio=$latest_studio"
            gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" -f use_latest_releases=true
          else
            echo 'No new formal upstream Release.'
          fi

