name: Check formal Hermes upstream Releases

on:
  # GitHub Actions cron uses UTC. 02:10 UTC is 10:10 Asia/Shanghai.
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream changes and trigger one unified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          state=$(bash ./scripts/check-upstream-state.sh both)
          eval "$state"
          echo "Agent: latest=$latest_agent compiled=$compiled_agent"
          echo "Studio: latest=$latest_studio compiled=$compiled_studio"
          echo "Effective target: $target"

          if [ "$target" = none ]; then
            echo 'No new formal upstream Release.'
            exit 0
          fi

          echo "Triggering one unified build for target: $target"
          gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" \
            -f target="$target" -f use_latest_releases=true
