name: Check formal Hermes upstream Releases

on:
  # GitHub Actions cron uses UTC. 04:10 UTC is 12:10 Asia/Shanghai.
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and trigger changed upstream projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          source versions.lock

          latest_formal_tag() {
            repository=$1
            candidates=$(gh api "repos/${repository}/releases?per_page=100" --paginate \
              --jq '([.[] | select(.draft == false and .prerelease == false)] | .[0].tag_name) // empty')
            printf '%s\\n' "${candidates%%$'\\n'*}"
          }

          latest_agent=$(latest_formal_tag NousResearch/hermes-agent)
          latest_studio=$(latest_formal_tag EKKOLearnAI/hermes-studio)
          test -n "$latest_agent" -a -n "$latest_studio"

          agent_changed=0
          studio_changed=0
          if [ "$latest_agent" != "$HERMES_AGENT_TAG" ]; then
            agent_changed=1
            echo "New Hermes Agent formal Release: $latest_agent"
            gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" \
              -f target=agent -f use_latest_releases=true
          fi

          if [ "$latest_studio" != "$HERMES_STUDIO_TAG" ]; then
            studio_changed=1
            echo "New Hermes Studio formal Release: $latest_studio"
            gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" \
              -f target=studio -f use_latest_releases=true
          fi

          if [ "$agent_changed" = 0 ] && [ "$studio_changed" = 0 ]; then
            echo 'No new formal upstream Release.'
          fi
