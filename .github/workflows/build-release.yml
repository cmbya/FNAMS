name: Build selected Hermes fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - '.github/build-agent-request'
      - '.github/build-both-request'
      - '.github/build-studio-request'
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'agent'
        type: choice
        options:
          - agent
          - studio
          - both
      package_version:
        description: 'Unified FNAMS FPK version (empty = next after latest v<version> release)'
        required: false
        default: ''
        type: string
      use_latest_releases:
        description: 'Resolve the newest formal upstream Releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Agent and Studio remain separate FPKs, but every update event uses one
# unified package version and one combined FNAMS Release.
concurrency:
  group: hermes-fpk-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine build target
        id: target
        run: |
          target="${{ inputs.target || '' }}"
          if [ -z "$target" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            if printf '%s\n' "$changed" | grep -qx '.github/build-both-request'; then
              target=both
            elif printf '%s\n' "$changed" | grep -qx '.github/build-studio-request'; then
              target=studio
            elif printf '%s\n' "$changed" | grep -qx '.github/build-agent-request'; then
              target=agent
            else
              echo 'No explicit build target request found.' >&2
              exit 2
            fi
          fi
          case "$target" in agent|studio|both) ;; *) echo "Invalid target: $target" >&2; exit 2 ;; esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zstd patchelf imagemagick librsvg2-bin unzip xz-utils busybox-static
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Run static checks
        run: ./tests/static.sh
      - name: Build selected FPK
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
          PACKAGE_VERSION_INPUT: ${{ inputs.package_version || '' }}
          USE_LATEST_RELEASES: ${{ inputs.use_latest_releases && '1' || '0' }}
        run: ./scripts/build-release.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-${{ steps.target.outputs.target }}-fnOS-${{ github.sha }}
          path: dist/
      - name: Create or update unified Release
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -eu
          manifest=dist/build-manifest.json
          package_version=$(jq -r '.package_version // empty' "$manifest")
          agent_upstream_display=$(jq -r '.upstream.agent.display_version // .hermes_agent.display_version // .upstream.agent.tag // .hermes_agent.tag // empty' "$manifest")
          studio_upstream_display=$(jq -r '.upstream.studio.display_version // .hermes_studio.display_version // .upstream.studio.tag // .hermes_studio.tag // empty' "$manifest")
          test -n "$package_version"

          release_tag="v$package_version"
          case "$BUILD_TARGET" in
            agent)
              test -n "$agent_upstream_display"
              release_title="Hermes Agent fnOS $package_version · upstream $agent_upstream_display"
              release_notes="更新类型：Hermes Agent。统一 fnOS 版本：$package_version。上游版本：$agent_upstream_display。目标平台：fnOS 1.2 x86_64。"
              ;;
            studio)
              test -n "$studio_upstream_display"
              release_title="Hermes Studio fnOS $package_version · upstream $studio_upstream_display"
              release_notes="更新类型：Hermes Studio。统一 fnOS 版本：$package_version。上游版本：$studio_upstream_display。目标平台：fnOS 1.2 x86_64。"
              ;;
            both)
              test -n "$agent_upstream_display" -a -n "$studio_upstream_display"
              release_title="Hermes Agent + Studio fnOS $package_version · upstream Agent $agent_upstream_display; Studio $studio_upstream_display"
              release_notes="更新类型：Hermes Agent + Hermes Studio。统一 fnOS 版本：$package_version。上游版本：Agent $agent_upstream_display；Studio $studio_upstream_display。目标平台：fnOS 1.2 x86_64。"
              ;;
            *) echo "Unknown release target: $BUILD_TARGET" >&2; exit 2 ;;
          esac

          ensure_release() {
            if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --title "$release_title" --notes "$release_notes"
            fi
          }

          upload_asset() {
            asset=$1
            attempt=1
            while [ "$attempt" -le 5 ]; do
              if gh release upload "$release_tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              echo "Release asset upload failed: tag=$release_tag asset=$asset attempt=$attempt" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to upload release asset: tag=$release_tag asset=$asset" >&2
            return 1
          }

          ensure_release
          if [ "$BUILD_TARGET" = "agent" ] || [ "$BUILD_TARGET" = "both" ]; then
            agent_asset="dist/HermesAgent-$package_version-fnOS-x86_64.fpk"
            test -s "$agent_asset"
            upload_asset "$agent_asset"
          fi
          if [ "$BUILD_TARGET" = "studio" ] || [ "$BUILD_TARGET" = "both" ]; then
            studio_asset="dist/HermesStudio-$package_version-fnOS-x86_64.fpk"
            test -s "$studio_asset"
            upload_asset "$studio_asset"
          fi
          upload_asset dist/SHA256SUMS
          upload_asset dist/build-manifest.json
          upload_asset dist/fpk-payload-check.log
          gh release edit "$release_tag" --title "$release_title" --notes "$release_notes" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Persist unified version state
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: bash ./scripts/update-versions-lock.sh "$BUILD_TARGET"
