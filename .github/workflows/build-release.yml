name: Build selected Hermes fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - '.github/build-agent-request'
      - '.github/build-both-request'
      - '.github/build-studio-request'
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to build'
        required: true
        default: 'agent'
        type: choice
        options:
          - agent
          - studio
          - both
      agent_version:
        description: 'Agent FPK version (empty = next after latest agent-v release)'
        required: false
        default: ''
        type: string
      studio_version:
        description: 'Studio FPK version (empty = next after latest studio-v release)'
        required: false
        default: ''
        type: string
      use_latest_releases:
        description: 'Resolve the newest formal upstream Releases'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Agent and Studio remain separate packages. This only serializes publication
# so two independently triggered builds cannot race while updating versions.lock.
concurrency:
  group: hermes-fpk-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine build target
        id: target
        run: |
          target="${{ inputs.target || '' }}"
          if [ -z "$target" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            if printf '%s\n' "$changed" | grep -qx '.github/build-both-request'; then
              target=both
            elif printf '%s\n' "$changed" | grep -qx '.github/build-studio-request'; then
              target=studio
            elif printf '%s\n' "$changed" | grep -qx '.github/build-agent-request'; then
              target=agent
            else
              echo 'No explicit build target request found.' >&2
              exit 2
            fi
          fi
          case "$target" in agent|studio|both) ;; *) echo "Invalid target: $target" >&2; exit 2 ;; esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq zstd patchelf imagemagick librsvg2-bin unzip xz-utils busybox-static
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Run static checks
        run: ./tests/static.sh
      - name: Build selected FPK
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
          AGENT_PACKAGE_VERSION: ${{ inputs.agent_version || '' }}
          STUDIO_PACKAGE_VERSION: ${{ inputs.studio_version || '' }}
          USE_LATEST_RELEASES: ${{ inputs.use_latest_releases && '1' || '0' }}
        run: ./scripts/build-release.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-${{ steps.target.outputs.target }}-fnOS-${{ github.sha }}
          path: dist/
      - name: Create or update independent Releases
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -eu
          manifest=dist/build-manifest.json
          agent_version=$(jq -r '.package_versions.agent // empty' "$manifest")
          studio_version=$(jq -r '.package_versions.studio // empty' "$manifest")
          agent_upstream_tag=$(jq -r '.upstream.agent.tag // .hermes_agent.tag // empty' "$manifest")
          studio_upstream_tag=$(jq -r '.upstream.studio.tag // .hermes_studio.tag // empty' "$manifest")

          ensure_release() {
            tag=$1
            title=$2
            notes=$3
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
          }

          upload_asset() {
            tag=$1
            asset=$2
            attempt=1
            while [ "$attempt" -le 5 ]; do
              if gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              echo "Release asset upload failed: tag=$tag asset=$asset attempt=$attempt" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "Failed to upload release asset: tag=$tag asset=$asset" >&2
            return 1
          }

          publish_release() {
            target=$1
            version=$2
            upstream_tag=$3
            case "$target" in
              agent)
                tag="agent-v${version}"
                title="Hermes Agent fnOS ${version}"
                notes="Hermes Agent 独立 FPK。目标平台：fnOS 1.2 x86_64。"
                asset="dist/HermesAgent-${version}-fnOS-x86_64.fpk"
                ;;
              studio)
                tag="studio-v${version}"
                title="Hermes Studio fnOS ${version}"
                notes="Hermes Studio 独立 FPK；需已安装 Hermes Agent。目标平台：fnOS 1.2 x86_64。"
                asset="dist/HermesStudio-${version}-fnOS-x86_64.fpk"
                ;;
              *) echo "Unknown release target: $target" >&2; exit 2 ;;
            esac
            if [ -n "$upstream_tag" ]; then
              title="${title} · upstream ${upstream_tag}"
              notes="${notes} 上游正式 Release：${upstream_tag}。"
            fi
            test -s "$asset"
            ensure_release "$tag" "$title" "$notes"
            upload_asset "$tag" "$asset"
            upload_asset "$tag" dist/SHA256SUMS
            upload_asset "$tag" dist/build-manifest.json
            upload_asset "$tag" dist/fpk-payload-check.log
            # Also update the title when a release tag already exists. This
            # keeps reruns and rebuilt packages in sync with the upstream tag.
            gh release edit "$tag" --title "$title" --draft=false --repo "$GITHUB_REPOSITORY"
          }

          if [ "$BUILD_TARGET" = "agent" ] || [ "$BUILD_TARGET" = "both" ]; then
            publish_release agent "$agent_version" "$agent_upstream_tag"
          fi
          if [ "$BUILD_TARGET" = "studio" ] || [ "$BUILD_TARGET" = "both" ]; then
            publish_release studio "$studio_version" "$studio_upstream_tag"
          fi

      - name: Persist independent version state
        env:
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: bash ./scripts/update-versions-lock.sh "$BUILD_TARGET"

